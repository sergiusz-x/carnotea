packages:
  - 'apps/*'
  - 'packages/*'
  - 'tooling/*'

linkWorkspacePackages: true

# Native modules that must be built before they can be used
onlyBuiltDependencies:
  - esbuild

# Dependency catalog — single source of truth for shared versions.
# Packages reference these with `"zod": "catalog:"` instead of pinning a version
# locally, so the whole monorepo upgrades in one place and `sherif` can prove
# there is no drift. Scaffold tickets (T-001+) extend this list as they add deps.
catalog:
  # Language + lint toolchain
  typescript: ^6.0.3
  eslint: ^10.15.0
  '@eslint/js': ^10.0.1
  eslint-plugin-import-x: ^4.18.1
  eslint-plugin-jsx-a11y: ^6.10.0
  eslint-plugin-react: ^7.37.2
  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.14.0
  prettier: ^3.10.1
  typescript-eslint: ^8.73.0
  # Validation (used by api, web, shared)
  zod: ^4.6.7
  # Web build toolchain
  vite: ^8.3.8
  '@vitejs/plugin-react': ^6.3.0
  # i18n (apps/web) — ADR-0007
  i18next: ^26.7.2
  react-i18next: ^17.1.13
  i18next-browser-languagedetector: ^8.3.1
  # Forms (apps/web) — T-031
  react-hook-form: ^7.92.0
  '@hookform/resolvers': ^5.9.2
  '@radix-ui/react-label': ^2.1.17
  '@radix-ui/react-slot': ^1.5.0
  # Tailwind CSS v4 + shadcn/ui dependencies
  tailwindcss: ^4.3.5
  '@tailwindcss/vite': ^4.3.5
  lucide-react: ^1.77.0
  clsx: ^2.1.1
  tailwind-merge: ^3.7.1
  class-variance-authority: ^0.7.1
  # Web routing + server-state (TanStack)
  '@tanstack/react-query': ^5.108.2
  '@tanstack/react-query-devtools': ^5.108.2
  '@tanstack/react-router': ^1.170.46
  '@tanstack/react-router-devtools': ^1.167.4
  # Testing
  '@playwright/test': ^1.65.1
  vitest: ^5.1.1
  jsdom: ^31.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/dom': ^10.4.2
  '@testing-library/jest-dom': ^8.0.0
  # Types
  '@types/node': ^26.6.6
  # Database
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  postgres: ^3.4.9
  # OpenAPI / Zod-to-OpenAPI
  '@asteasolutions/zod-to-openapi': ^8.5.0
  # API (apps/api) — NestJS + Fastify stack
  '@nestjs/common': ^11.2.11
  '@nestjs/core': ^11.2.11
  '@nestjs/config': ^4.0.4
  '@nestjs/platform-fastify': ^11.2.11
  '@nestjs/testing': ^11.2.11
  '@nestjs/cli': ^11.0.24
  fastify: ^5.12.8
  nestjs-pino: ^4.6.1
  pino-http: ^11.0.0
  pino-pretty: ^13.2.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  '@swc/cli': ^0.8.2
  '@swc/core': ^1.16.22
  # Auth (apps/api) — better-auth, ADR-0004
  better-auth: ^1.7.27
  # Email transport (apps/api) — T-051
  nodemailer: ^10.6.1
  '@types/nodemailer': ^8.0.2
  # Security — T-049
  '@fastify/helmet': ^13.2.0
  '@fastify/rate-limit': ^11.2.2
  '@fastify/cors': ^11.4.3
  # Performance budget — T-044
  '@lhci/cli': ^0.16.1
  size-limit: ^14.3.0
  '@size-limit/preset-app': ^14.3.0

# React-family versions live in a named catalog so non-React packages never
# accidentally pull them in.
catalogs:
  react19:
    react: ^19.3.1
    react-dom: ^19.3.1
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
